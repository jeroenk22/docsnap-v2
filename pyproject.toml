[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsnap-v2"
version = "0.1.0"
description = "CLI tool die elke documentatiesite automatisch scrapt naar schone Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright==1.60.0",
    "anthropic==0.105.2",
    "click==8.3.2",
    "python-dotenv==1.2.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.14",
    "pytest==9.0.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]
pdf = [
    "weasyprint>=62.0",
]

[project.scripts]
docsnap = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
